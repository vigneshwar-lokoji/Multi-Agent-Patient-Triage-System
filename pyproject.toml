[project]
name = "triage"
version = "0.1.0"
description = "Multi-agent patient triage system: synthetic data generation + local LLM agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "ollama>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]
